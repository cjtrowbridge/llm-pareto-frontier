schema_version: 2
pipeline_id: llm-pareto-frontier

contract:
  goal: Measure inference cost per million generated tokens against model capability and maintain the repo's taxonomy JSON rollups and Pareto frontier visualization.
  allowed_changes: [taxonomy/**/model.json, taxonomy/**/lab.json, taxonomy/taxonomy.json, taxonomy/**/whitepaper.md, taxonomy/**/index.md, artifacts/pareto-frontier.html, artifacts/capability-cost.svg, artifacts/capability-cost.html]
  protected_invariants: [models.csv, taxonomy/**/livebench.csv, taxonomy/**/whitepaper.*, source urls in per-model citations]

source:
  root: taxonomy
  glob: "**/model.json"

paths:
  state: state/pipeline.sqlite
  artifacts: artifacts
  threads: threads
  reports: reports
  output_schema: "@framework/schemas/prompt_outputs.schema.json"

stages:
  worker:
    prompt: prompts/worker.md
    id: host.pareto_refresh
    version: 0.1.0
    output: worker_result
    llm_justification: none — deterministic stage; no LLM is invoked. Capability is a scored function of cited benchmark values, cost is min(home-electricity-rate, openrouter-rate, lab-rate), and the frontier is a deterministic 2-D dominance filter. This field is a required placeholder until deterministic-semantic-human governance is adopted for schema 5.
    max_attempts: 1

validation:
  required_substrings: []
  protected_substrings: []
  max_change_ratio: 1.0
  require_front_matter: false
  require_balanced_fences: false

runtime:
  lease_seconds: 900
  lock_stale_seconds: 3600
  max_repairs: 0
  max_source_bytes: 1000000
  max_candidate_bytes: 1000000

promotion:
  enabled: false
  backup_root: artifacts/backups
